name: Fetch News Feed

on:
  schedule:
    # Runs every 6 hours. Adjust to match how often your sources actually update.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated output/feed.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser playwright
          playwright install --with-deps chromium

      - name: Run fetch script
        run: python fetch-news.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/feed.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update feed.json [automated]"
          git push