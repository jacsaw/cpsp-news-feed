name: Fetch News Feed

on:
  schedule:
    # 6:00am, 12:00pm, and 4:30pm ET. GitHub Actions cron is always UTC and
    # doesn't shift for DST, so these times are pinned to EDT (UTC-4); they'll
    # run an hour later in local time during EST (roughly Nov-Mar).
    - cron: "0 10,16 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed to commit the updated output/feed.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install feedparser playwright
          playwright install --with-deps chromium

      - name: Run fetch script
        run: python fetch-news.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/feed.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Update feed.json [automated]"
          git push